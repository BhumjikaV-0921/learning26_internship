{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            background-image: linear-gradient(to bottom right, #fbb47d, #4e2505);
            font-family: 'Lucida Sans', Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: #fff;
            padding: 40px;
            width: 350px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            text-align: center;
        }

        .login-container h2 {
            color: #002a26;
            margin-bottom: 25px;
            font-weight: 600;
        }

        form p {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            color: #002a26;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: none;
            outline: none;
            background: #eee;
            font-size: 14px;
        }

        input:focus {
            border: 2px solid #875852;
            background: #fff;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #875852;
            border: none;
            border-radius: 10px;
            color: #ffd3ac;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            background: #002d28;
        }

        .error-message {
            color: #ff6b6b;
            margin-top: 10px;
            font-size: 14px;
        }

        .footer-text {
            margin-top: 15px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>

<body>

<div class="login-container">
    <h2>Admin Panel</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>

    {% for message in messages %}
        <p class="error-message">{{ message }}</p>
    {% endfor %}

    <div class="footer-text">
        Secure access only
    </div>
</div>

</body>
</html>
