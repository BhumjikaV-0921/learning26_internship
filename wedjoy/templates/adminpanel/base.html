{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">

</head>

<body>
<div class="page">
    <!-- SIDEBAR -->
    <div class="sidebar">
        <img src="{% static 'images/logo.png' %}" style="width:80%;margin-top:-25%;margin-left:5%">
        <h2 style="text-align:center">Admin Panel</h2>
        <a href="{% url 'adminpanel:dashboard' %}">Dashboard</a>
        <a href="{% url 'adminpanel:users' %}">Users</a>
        <a href="{% url 'adminpanel:events' %}">Events</a>
        <a href="{% url 'adminpanel:businesses' %}">Businesses</a>
        <a href="{% url 'adminpanel:volunteer_list' %}">Volunteers</a>
        <a href="{% url 'adminpanel:logout' %}">Logout</a>
    </div>

    <!-- MAIN -->
    <div class="main">

    <!-- TOPBAR -->
    <div class="topbar">
        <h2>{% block title %}Dashboard{% endblock %}</h2>

        <div class="profile">
            <div class="avatar">
                {{ request.user.email|first|upper }}
            </div>
        </div>
    </div>

    <!-- CONTENT -->
    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

    </div>
</div>

</body>
</html>
