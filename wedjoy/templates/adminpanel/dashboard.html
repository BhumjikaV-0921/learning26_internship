{% extends "adminpanel/base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}

<!-- CARDS -->
<div class="cards">

    <div class="card">
        <h3>Total Users</h3>
        <h2>{{ total_users }}</h2>
    </div>

    <div class="card">
        <h3>Total Events</h3>
        <h2>{{ total_events }}</h2>
    </div>

    <div class="card">
        <h3>Total Businesses</h3>
        <h2>{{ total_businesses }}</h2>
    </div>

    <div class="card">
        <h3>Volunteers</h3>
        <h2>{{ total_volunteers }}</h2>
    </div>

</div>

<!-- CHARTS -->
<div class="charts">

    <!-- LINE -->
    <div class="chart-box">
        <h3>Platform Growth</h3>
        <canvas id="lineChart"></canvas>
    </div>

    <!-- DONUT -->
    <div class="chart-box">
        <h3>Business Categories</h3>
        <canvas id="donutChart"></canvas>
    </div>

</div>

<script>
    const months = {{ months|safe }};
    const growthData = {{ growth_data|safe }};

    const categories = {{ categories|safe }};
    const categoryCounts = {{ category_counts|safe }};

    // 📈 REAL Growth Chart
    new Chart(document.getElementById('lineChart'), {
        type: 'line',
        data: {
            labels: months,
            datasets: [{
                label: 'Platform Growth',
                data: growthData,
                borderWidth: 2,
                fill: true,
                tension: 0.4
            }]
        }
    });

    // 🍩 REAL Category Chart
    new Chart(document.getElementById('donutChart'), {
        type: 'doughnut',
        data: {
            labels: categories,
            datasets: [{
                data: categoryCounts
            }]
        }
    });
</script>

{% endblock %}
