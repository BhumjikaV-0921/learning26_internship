{% extends "core/base.html" %}

{% block title %}Send OTP - WedJoy{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Send OTP</h3>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="{{ form.email.id_for_label }}" class="form-label">Email Address</label>
                            {{ form.email }}
                            {% if form.email.errors %}
                                <div class="text-danger">
                                    {% for error in form.email.errors %}
                                        {{ error }}
                                    {% endfor %}
                                </div>
                            {% endif %}
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Purpose</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="otp_type" id="registration" value="registration" checked>
                                <label class="form-check-label" for="registration">
                                    Account Registration
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="otp_type" id="login" value="login">
                                <label class="form-check-label" for="login">
                                    Login
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="otp_type" id="password_reset" value="password_reset">
                                <label class="form-check-label" for="password_reset">
                                    Password Reset
                                </label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary">Send OTP</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
